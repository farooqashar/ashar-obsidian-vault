# Copy this file into the VAULT repo at:
#   ashar-obsidian-vault/.github/workflows/notify-reading-site.yml
#
# Every time obsidian-git pushes a change under Clippings/, this pings the
# reading site's build hook (Netlify or Vercel), which rebuilds the site from the latest vault.
#
# Needs a secret in the vault repo: DEPLOY_HOOK (same URL as the site repo's).
name: Update reading site

on:
  push:
    branches: [main]
    paths:
      - "Clippings/**"
  workflow_dispatch:

concurrency:
  group: reading-site
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK"
